name: Deploy a Firebase Hosting

# Despliega el sitio cuando hay push a main (deploy en vivo)
# y crea una preview temporal en cada Pull Request.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Deploy a Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # En push a main -> canal "live" (producción). En PR -> preview temporal.
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
          projectId: cursorwebapp-f376d
          target: latamcodefactory
