<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Breakout - Eco Plagas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050816;color:#fff;font-family:'DM Sans',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.top-bar a{color:#f5576c;text-decoration:none;font-size:14px;display:flex;align-items:center;gap:6px;transition:color .2s}
.top-bar a:hover{color:#f993a3}
.top-bar .title{font-weight:700;font-size:16px;background:linear-gradient(135deg,#f093fb,#f5576c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top-bar .score-display{font-size:14px;font-weight:600;color:#f5576c}
.game-area{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;position:relative;min-height:0}
canvas#game{border:2px solid rgba(240,147,251,.25);border-radius:10px;display:block;max-width:100%;max-height:100%;touch-action:none}

.overlay{position:fixed;inset:0;background:rgba(5,8,22,.92);display:flex;align-items:center;justify-content:center;z-index:100;opacity:1;transition:opacity .3s}
.overlay.hidden{opacity:0;pointer-events:none}
.overlay-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:40px 32px;text-align:center;max-width:340px;width:90%}
.overlay-card h2{font-size:28px;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,#f093fb,#f5576c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.overlay-card p{color:rgba(255,255,255,.6);font-size:14px;line-height:1.6;margin-bottom:20px}
.overlay-card .final-score{font-size:48px;font-weight:700;color:#f5576c;margin:12px 0 4px}
.overlay-card .best{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:20px}
.overlay-card .level-text{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:16px}
.btn-play{display:inline-flex;align-items:center;gap:8px;padding:14px 36px;border-radius:12px;border:none;background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn-play:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(245,87,108,.4)}
.btn-play:active{transform:scale(.96)}
.link-back{display:inline-block;margin-top:16px;color:rgba(255,255,255,.4);font-size:13px;text-decoration:none;transition:color .2s}
.link-back:hover{color:#f5576c}
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html#juegos"><i class="fas fa-arrow-left"></i> Volver</a>
  <span class="title">BREAKOUT</span>
  <span class="score-display" id="topScore"><i class="fas fa-star"></i> 0</span>
</div>

<div class="game-area">
  <canvas id="game"></canvas>
</div>

<div class="overlay" id="startOverlay">
  <div class="overlay-card">
    <h2><i class="fas fa-table-cells"></i> Breakout</h2>
    <p>Mueve la paleta con el mouse, touch o flechas del teclado. Destruye todos los bloques para avanzar de nivel.</p>
    <button class="btn-play" id="btnStart"><i class="fas fa-play"></i> Jugar</button>
  </div>
</div>

<div class="overlay hidden" id="gameOverOverlay">
  <div class="overlay-card">
    <h2>Game Over</h2>
    <div class="final-score" id="finalScore">0</div>
    <div class="level-text" id="levelText">Nivel alcanzado: 1</div>
    <div class="best" id="bestScore">Mejor: 0</div>
    <button class="btn-play" id="btnRestart"><i class="fas fa-rotate-right"></i> Jugar de nuevo</button>
    <br><a href="../index.html#juegos" class="link-back"><i class="fas fa-home"></i> Volver al inicio</a>
  </div>
</div>

<script>
(function(){
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const dpr=window.devicePixelRatio||1;

const W=420,H=600;
canvas.width=W*dpr;canvas.height=H*dpr;
canvas.style.width=W+'px';canvas.style.height=H+'px';
ctx.scale(dpr,dpr);

const BRICK_COLS=8,BRICK_ROWS=5;
const BRICK_PAD=6,BRICK_TOP=60;
const BRICK_W=(W-BRICK_PAD*(BRICK_COLS+1))/BRICK_COLS;
const BRICK_H=20;
const PADDLE_W=80,PADDLE_H=14,PADDLE_Y=H-40;
const BALL_R=7;
const ROW_COLORS=['#f5576c','#f093fb','#a78bfa','#667eea','#00f2fe'];
const ROW_SCORES=[50,40,30,20,10];

let paddleX,ballX,ballY,ballVX,ballVY,ballSpeed;
let bricks,score,lives,level,running,animId;
let particles=[];
let trail=[];
let keysDown={};

function initBricks(){
  bricks=[];
  for(let r=0;r<BRICK_ROWS;r++){
    for(let c=0;c<BRICK_COLS;c++){
      bricks.push({
        x:BRICK_PAD+c*(BRICK_W+BRICK_PAD),
        y:BRICK_TOP+r*(BRICK_H+BRICK_PAD),
        w:BRICK_W,h:BRICK_H,
        color:ROW_COLORS[r],
        score:ROW_SCORES[r],
        alive:true
      });
    }
  }
}

function resetBall(){
  ballX=W/2;ballY=PADDLE_Y-30;
  const angle=-Math.PI/2+(Math.random()-.5)*0.8;
  ballVX=Math.cos(angle)*ballSpeed;
  ballVY=Math.sin(angle)*ballSpeed;
  trail=[];
}

function spawnParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    particles.push({
      x,y,
      vx:(Math.random()-.5)*8,
      vy:(Math.random()-.5)*8,
      life:25+Math.random()*15,
      maxLife:40,
      color,
      w:Math.random()*6+2,
      h:Math.random()*4+2
    });
  }
}

function startGame(){
  score=0;lives=3;level=1;ballSpeed=4;
  paddleX=W/2-PADDLE_W/2;
  particles=[];trail=[];
  initBricks();resetBall();
  updateUI();running=true;
  animId=requestAnimationFrame(loop);
}

function nextLevel(){
  level++;
  ballSpeed=4+level*0.5;
  initBricks();resetBall();
}

function updateUI(){
  document.getElementById('topScore').innerHTML='<i class="fas fa-star"></i> '+score;
}

function gameOver(){
  running=false;cancelAnimationFrame(animId);
  const best=Math.max(score,parseInt(localStorage.getItem('breakout_best')||'0'));
  localStorage.setItem('breakout_best',best);
  document.getElementById('finalScore').textContent=score;
  document.getElementById('levelText').textContent='Nivel alcanzado: '+level;
  document.getElementById('bestScore').textContent='Mejor: '+best;
  document.getElementById('gameOverOverlay').classList.remove('hidden');
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // bricks
  bricks.forEach(b=>{
    if(!b.alive)return;
    ctx.fillStyle=b.color;
    ctx.beginPath();
    ctx.roundRect(b.x,b.y,b.w,b.h,5);
    ctx.fill();
    // shine
    ctx.fillStyle='rgba(255,255,255,0.15)';
    ctx.fillRect(b.x+3,b.y+2,b.w-6,3);
  });

  // paddle
  const pg=ctx.createLinearGradient(paddleX,0,paddleX+PADDLE_W,0);
  pg.addColorStop(0,'#f093fb');pg.addColorStop(1,'#f5576c');
  ctx.fillStyle=pg;
  ctx.beginPath();
  ctx.roundRect(paddleX,PADDLE_Y,PADDLE_W,PADDLE_H,7);
  ctx.fill();
  // paddle glow
  ctx.shadowColor='#f5576c';ctx.shadowBlur=15;
  ctx.beginPath();
  ctx.roundRect(paddleX,PADDLE_Y,PADDLE_W,PADDLE_H,7);
  ctx.fill();
  ctx.shadowBlur=0;

  // ball trail
  trail.forEach((t,i)=>{
    const a=(i+1)/trail.length*0.3;
    ctx.globalAlpha=a;
    ctx.fillStyle='#f5576c';
    ctx.beginPath();
    ctx.arc(t.x,t.y,BALL_R*(0.5+0.5*(i/trail.length)),0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;

  // ball
  const bg=ctx.createRadialGradient(ballX-2,ballY-2,0,ballX,ballY,BALL_R);
  bg.addColorStop(0,'#fff');bg.addColorStop(0.4,'#f993a3');bg.addColorStop(1,'#f5576c');
  ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.arc(ballX,ballY,BALL_R,0,Math.PI*2);
  ctx.fill();
  // ball glow
  ctx.shadowColor='#f5576c';ctx.shadowBlur=12;
  ctx.beginPath();
  ctx.arc(ballX,ballY,BALL_R,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;

  // particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.life*0.2);
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  });
  ctx.globalAlpha=1;

  // lives
  for(let i=0;i<lives;i++){
    ctx.fillStyle='#f5576c';
    ctx.beginPath();
    ctx.arc(W-20-i*22,20,6,0,Math.PI*2);
    ctx.fill();
  }

  // level
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.font='13px DM Sans';
  ctx.fillText('Nivel '+level,12,24);
}

function update(){
  // keyboard paddle
  if(keysDown['ArrowLeft'])paddleX=Math.max(0,paddleX-7);
  if(keysDown['ArrowRight'])paddleX=Math.min(W-PADDLE_W,paddleX+7);

  // trail
  trail.push({x:ballX,y:ballY});
  if(trail.length>5)trail.shift();

  ballX+=ballVX;ballY+=ballVY;

  // walls
  if(ballX-BALL_R<=0){ballX=BALL_R;ballVX=Math.abs(ballVX);}
  if(ballX+BALL_R>=W){ballX=W-BALL_R;ballVX=-Math.abs(ballVX);}
  if(ballY-BALL_R<=0){ballY=BALL_R;ballVY=Math.abs(ballVY);}

  // bottom
  if(ballY+BALL_R>=H){
    lives--;
    if(lives<=0){gameOver();return;}
    resetBall();
    return;
  }

  // paddle
  if(ballVY>0&&ballY+BALL_R>=PADDLE_Y&&ballY+BALL_R<=PADDLE_Y+PADDLE_H&&ballX>=paddleX&&ballX<=paddleX+PADDLE_W){
    const hit=(ballX-paddleX)/PADDLE_W; // 0..1
    const angle=-(Math.PI*0.15+hit*Math.PI*0.7); // -15deg..-85deg mapped
    const spd=Math.sqrt(ballVX*ballVX+ballVY*ballVY);
    ballVX=Math.cos(angle)*spd;
    ballVY=Math.sin(angle)*spd;
    ballY=PADDLE_Y-BALL_R;
    spawnParticles(ballX,PADDLE_Y,'#f093fb',4);
  }

  // bricks
  let allDead=true;
  bricks.forEach(b=>{
    if(!b.alive)return;
    allDead=false;
    if(ballX+BALL_R>b.x&&ballX-BALL_R<b.x+b.w&&ballY+BALL_R>b.y&&ballY-BALL_R<b.y+b.h){
      b.alive=false;
      score+=b.score;
      updateUI();
      spawnParticles(b.x+b.w/2,b.y+b.h/2,b.color,10);

      // determine bounce side
      const overlapLeft=ballX+BALL_R-b.x;
      const overlapRight=b.x+b.w-(ballX-BALL_R);
      const overlapTop=ballY+BALL_R-b.y;
      const overlapBottom=b.y+b.h-(ballY-BALL_R);
      const minOverlap=Math.min(overlapLeft,overlapRight,overlapTop,overlapBottom);
      if(minOverlap===overlapTop||minOverlap===overlapBottom)ballVY=-ballVY;
      else ballVX=-ballVX;
    }
  });

  if(allDead)nextLevel();

  // particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.life--;});
  particles=particles.filter(p=>p.life>0);
}

function loop(){
  if(!running)return;
  update();draw();
  animId=requestAnimationFrame(loop);
}

// input
document.addEventListener('keydown',e=>{keysDown[e.key]=true;if(e.key==='ArrowLeft'||e.key==='ArrowRight')e.preventDefault();});
document.addEventListener('keyup',e=>{keysDown[e.key]=false;});

canvas.addEventListener('mousemove',e=>{
  if(!running)return;
  const rect=canvas.getBoundingClientRect();
  const scaleX=W/rect.width;
  paddleX=Math.max(0,Math.min(W-PADDLE_W,(e.clientX-rect.left)*scaleX-PADDLE_W/2));
});

canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!running)return;
  const rect=canvas.getBoundingClientRect();
  const scaleX=W/rect.width;
  const t=e.touches[0];
  paddleX=Math.max(0,Math.min(W-PADDLE_W,(t.clientX-rect.left)*scaleX-PADDLE_W/2));
},{passive:false});

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!running)return;
  const rect=canvas.getBoundingClientRect();
  const scaleX=W/rect.width;
  const t=e.touches[0];
  paddleX=Math.max(0,Math.min(W-PADDLE_W,(t.clientX-rect.left)*scaleX-PADDLE_W/2));
},{passive:false});

// start/restart
document.getElementById('btnStart').addEventListener('click',()=>{
  document.getElementById('startOverlay').classList.add('hidden');
  startGame();
});
document.getElementById('btnRestart').addEventListener('click',()=>{
  document.getElementById('gameOverOverlay').classList.add('hidden');
  startGame();
});
})();
</script>
</body>
</html>
