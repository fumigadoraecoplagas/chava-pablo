<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Neon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:#050816;color:#fff;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
.top-bar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(5,8,22,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06);z-index:100}
.top-bar a{color:rgba(255,255,255,.6);text-decoration:none;font-size:14px;display:flex;align-items:center;gap:6px;transition:color .2s}
.top-bar a:hover{color:#4facfe}
.top-bar .title{font-weight:700;font-size:16px;background:linear-gradient(135deg,#4facfe,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top-bar .score-display{font-size:14px;font-weight:600;color:rgba(255,255,255,.7)}
#gameCanvas{display:block;width:100%;height:100%}
.overlay{position:fixed;inset:0;background:rgba(5,8,22,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;z-index:200;opacity:1;transition:opacity .3s}
.overlay.hidden{opacity:0;pointer-events:none}
.overlay-card{text-align:center;padding:40px 32px;border-radius:24px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);max-width:360px;width:90%}
.overlay-card h1{font-size:32px;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,#4facfe,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay-card .subtitle{color:rgba(255,255,255,.5);font-size:14px;margin-bottom:24px;line-height:1.5}
.overlay-card .final-score{font-size:64px;font-weight:700;background:linear-gradient(135deg,#4facfe,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.overlay-card .best{font-size:14px;color:rgba(255,255,255,.4);margin-bottom:24px}
.btn-play{display:inline-flex;align-items:center;gap:8px;padding:14px 36px;border:none;border-radius:14px;background:linear-gradient(135deg,#4facfe,#00f2fe);color:#050816;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 0 24px rgba(79,172,254,.3)}
.btn-play:hover{transform:scale(1.04);box-shadow:0 0 32px rgba(79,172,254,.5)}
.btn-play:active{transform:scale(.97)}
.back-link{display:inline-block;margin-top:16px;color:rgba(255,255,255,.4);text-decoration:none;font-size:13px;transition:color .2s}
.back-link:hover{color:#4facfe}
</style>
</head>
<body>
<div class="top-bar">
  <a href="../index.html#juegos"><i class="fas fa-arrow-left"></i> Volver</a>
  <span class="title">Flappy Neon</span>
  <span class="score-display" id="topScore">0</span>
</div>

<canvas id="gameCanvas"></canvas>

<div class="overlay" id="startOverlay">
  <div class="overlay-card">
    <h1><i class="fas fa-dove"></i> Flappy Neon</h1>
    <p class="subtitle">Toca la pantalla, haz clic o presiona Espacio para volar.<br>Esquiva las columnas y llega lo mas lejos posible.</p>
    <button class="btn-play" id="btnStart"><i class="fas fa-play"></i> Jugar</button>
  </div>
</div>

<div class="overlay hidden" id="gameOverOverlay">
  <div class="overlay-card">
    <h1>Game Over</h1>
    <div class="final-score" id="finalScore">0</div>
    <div class="best" id="bestScoreText">Mejor: 0</div>
    <button class="btn-play" id="btnRestart"><i class="fas fa-redo"></i> Jugar de nuevo</button>
    <br><a href="../index.html#juegos" class="back-link"><i class="fas fa-th"></i> Volver a juegos</a>
  </div>
</div>

<script>
(function(){
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const startOverlay=document.getElementById('startOverlay');
const gameOverOverlay=document.getElementById('gameOverOverlay');
const topScoreEl=document.getElementById('topScore');
const finalScoreEl=document.getElementById('finalScore');
const bestScoreTextEl=document.getElementById('bestScoreText');
const btnStart=document.getElementById('btnStart');
const btnRestart=document.getElementById('btnRestart');

let W,H,dpr;
let bird,pipes,stars1,stars2,particles;
let score,bestScore,gravity,flapStrength,pipeSpeed,pipeGap,pipeWidth,pipeInterval;
let gameRunning=false,gameOver=false;
let frameCount=0;
let shakeTimer=0,shakeIntensity=0;
let lastTime=0;

bestScore=parseInt(localStorage.getItem('flappy_best'))||0;

function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;
  H=window.innerHeight;
  canvas.width=W*dpr;
  canvas.height=H*dpr;
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);
resize();

function initStars(){
  stars1=[];stars2=[];
  for(let i=0;i<60;i++) stars1.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,a:Math.random()*.5+.2});
  for(let i=0;i<30;i++) stars2.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.5,a:Math.random()*.3+.1});
}

function initGame(){
  const birdR=Math.min(W,H)*0.028;
  bird={x:W*0.25,y:H*0.45,r:birdR>18?18:birdR<10?10:birdR,vy:0,trail:[]};
  pipes=[];
  particles=[];
  score=0;
  frameCount=0;
  shakeTimer=0;
  gravity=0.38;
  flapStrength=-6.5;
  pipeSpeed=2.5;
  pipeGap=140;
  pipeWidth=52;
  pipeInterval=110;
  gameOver=false;
  topScoreEl.textContent='0';
  initStars();
}

function flap(){
  if(gameOver)return;
  if(!gameRunning){startGame();return;}
  bird.vy=flapStrength;
}

function startGame(){
  initGame();
  gameRunning=true;
  startOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
  bird.vy=flapStrength;
  lastTime=performance.now();
  requestAnimationFrame(loop);
}

function endGame(){
  gameOver=true;
  gameRunning=false;
  shakeTimer=300;
  shakeIntensity=8;
  if(score>bestScore){bestScore=score;localStorage.setItem('flappy_best',bestScore);}
  setTimeout(()=>{
    finalScoreEl.textContent=score;
    bestScoreTextEl.textContent='Mejor: '+bestScore;
    gameOverOverlay.classList.remove('hidden');
  },500);
}

function spawnPipe(){
  const minTop=60;
  const maxTop=H-pipeGap-60;
  const gap=Math.max(pipeGap-score*0.8,100);
  const topH=Math.random()*(maxTop-minTop-gap+pipeGap)+minTop;
  pipes.push({x:W+10,topH:topH,botY:topH+gap,scored:false});
}

function spawnParticles(x,y){
  for(let i=0;i<12;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=Math.random()*3+1;
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,r:Math.random()*3+1,color:Math.random()>.5?'#4facfe':'#00f2fe'});
  }
}

function update(dt){
  if(gameOver)return;
  const scale=dt/16.67;

  // Bird physics
  bird.vy+=gravity*scale;
  bird.y+=bird.vy*scale;
  bird.trail.unshift({x:bird.x,y:bird.y});
  if(bird.trail.length>3)bird.trail.pop();

  // Stars parallax
  stars1.forEach(s=>{s.x-=0.3*scale;if(s.x<0)s.x=W;});
  stars2.forEach(s=>{s.x-=0.6*scale;if(s.x<0)s.x=W;});

  // Pipes
  frameCount++;
  if(frameCount%pipeInterval===0)spawnPipe();
  for(let i=pipes.length-1;i>=0;i--){
    const p=pipes[i];
    p.x-=pipeSpeed*scale;
    if(p.x+pipeWidth<0){pipes.splice(i,1);continue;}
    // Score
    if(!p.scored&&p.x+pipeWidth<bird.x){
      p.scored=true;
      score++;
      topScoreEl.textContent=score;
      spawnParticles(bird.x+bird.r+10,bird.y);
    }
    // Collision
    if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+pipeWidth){
      if(bird.y-bird.r<p.topH||bird.y+bird.r>p.botY){endGame();return;}
    }
  }

  // Floor/ceiling
  if(bird.y+bird.r>H||bird.y-bird.r<0){endGame();return;}

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*scale;p.y+=p.vy*scale;
    p.life-=0.025*scale;
    if(p.life<=0)particles.splice(i,1);
  }

  // Speed up slightly
  if(frameCount%300===0&&pipeSpeed<5)pipeSpeed+=0.15;
}

function draw(){
  ctx.save();

  // Shake
  if(shakeTimer>0){
    const ox=(Math.random()-.5)*shakeIntensity;
    const oy=(Math.random()-.5)*shakeIntensity;
    ctx.translate(ox,oy);
    shakeTimer-=16;
    shakeIntensity*=0.92;
  }

  // Background
  ctx.fillStyle='#050816';
  ctx.fillRect(0,0,W,H);

  // Stars layer 1
  stars1.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
  // Stars layer 2
  stars2.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle='#c8d6e5';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;

  // Pipes
  pipes.forEach(p=>{
    const grad=ctx.createLinearGradient(p.x,0,p.x+pipeWidth,0);
    grad.addColorStop(0,'#4facfe');
    grad.addColorStop(1,'#00f2fe');
    const r=8;
    // Top pipe
    ctx.fillStyle=grad;
    roundRect(ctx,p.x,0,pipeWidth,p.topH,{bl:r,br:r});
    ctx.fill();
    // Bottom pipe
    roundRect(ctx,p.x,p.botY,pipeWidth,H-p.botY,{tl:r,tr:r});
    ctx.fill();
    // Glow
    ctx.shadowColor='#4facfe';ctx.shadowBlur=18;
    ctx.strokeStyle='rgba(79,172,254,.25)';ctx.lineWidth=2;
    roundRect(ctx,p.x,0,pipeWidth,p.topH,{bl:r,br:r});ctx.stroke();
    roundRect(ctx,p.x,p.botY,pipeWidth,H-p.botY,{tl:r,tr:r});ctx.stroke();
    ctx.shadowBlur=0;
  });

  // Bird trail
  bird.trail.forEach((t,i)=>{
    const alpha=(3-i)/3*0.25;
    const rScale=1-i*0.12;
    ctx.globalAlpha=alpha;
    const tg=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,bird.r*rScale);
    tg.addColorStop(0,'#4facfe');tg.addColorStop(1,'#00f2fe');
    ctx.fillStyle=tg;
    ctx.beginPath();ctx.arc(t.x,t.y,bird.r*rScale,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Bird
  const bg=ctx.createRadialGradient(bird.x,bird.y,0,bird.x,bird.y,bird.r);
  bg.addColorStop(0,'#fff');bg.addColorStop(0.3,'#4facfe');bg.addColorStop(1,'#00f2fe');
  ctx.fillStyle=bg;
  ctx.shadowColor='#4facfe';ctx.shadowBlur=20;
  ctx.beginPath();ctx.arc(bird.x,bird.y,bird.r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
  });
  ctx.shadowBlur=0;
  ctx.globalAlpha=1;

  // Score center top
  if(gameRunning&&!gameOver){
    ctx.fillStyle='rgba(255,255,255,.12)';
    ctx.font='700 72px "DM Sans"';
    ctx.textAlign='center';
    ctx.fillText(score,W/2,H*0.18);
  }

  ctx.restore();
}

function roundRect(ctx,x,y,w,h,corners){
  const tl=corners.tl||0,tr=corners.tr||0,br=corners.br||0,bl=corners.bl||0;
  ctx.beginPath();
  ctx.moveTo(x+tl,y);
  ctx.lineTo(x+w-tr,y);ctx.quadraticCurveTo(x+w,y,x+w,y+tr);
  ctx.lineTo(x+w,y+h-br);ctx.quadraticCurveTo(x+w,y+h,x+w-br,y+h);
  ctx.lineTo(x+bl,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-bl);
  ctx.lineTo(x,y+tl);ctx.quadraticCurveTo(x,y,x+tl,y);
  ctx.closePath();
}

function loop(ts){
  if(!gameRunning&&!gameOver)return;
  const dt=Math.min(ts-lastTime,32);
  lastTime=ts;
  update(dt);
  draw();
  if(gameOver){
    // Keep drawing for shake
    if(shakeTimer>0)requestAnimationFrame(loop);
    return;
  }
  requestAnimationFrame(loop);
}

// Draw idle background
function drawIdle(){
  initStars();
  function idleLoop(){
    if(gameRunning)return;
    stars1.forEach(s=>{s.x-=0.3;if(s.x<0)s.x=W;});
    stars2.forEach(s=>{s.x-=0.6;if(s.x<0)s.x=W;});
    ctx.fillStyle='#050816';ctx.fillRect(0,0,W,H);
    stars1.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
    stars2.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle='#c8d6e5';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
    ctx.globalAlpha=1;
    requestAnimationFrame(idleLoop);
  }
  idleLoop();
}
drawIdle();
initGame();

// Controls
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap();}});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();flap();});
btnStart.addEventListener('click',e=>{e.stopPropagation();startGame();});
btnRestart.addEventListener('click',e=>{e.stopPropagation();startGame();});
})();
</script>
</body>
</html>
