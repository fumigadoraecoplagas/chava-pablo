<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Memory - Juego</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{background:#050816;font-family:'DM Sans',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}

/* Top Bar */
.top-bar{width:100%;max-width:500px;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;position:relative;z-index:10}
.top-bar a{color:#94a3b8;text-decoration:none;font-size:14px;display:flex;align-items:center;gap:6px;transition:color .2s}
.top-bar a:hover{color:#fff}
.top-bar h1{font-size:20px;font-weight:700;background:linear-gradient(135deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Stats row */
.stats-row{width:100%;max-width:500px;display:flex;justify-content:center;gap:12px;padding:0 20px 12px}
.stat-box{background:linear-gradient(135deg,#f7971e11,#ffd20011);border:1px solid #f7971e33;border-radius:10px;padding:6px 14px;text-align:center;flex:1;max-width:120px}
.stat-box .label{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.stat-box .value{font-size:18px;font-weight:900;background:linear-gradient(135deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Stars */
.stars{font-size:20px;margin:8px 0 4px;display:flex;justify-content:center;gap:4px}
.stars i{color:#334155;transition:color .3s}
.stars i.active{color:#ffd200;text-shadow:0 0 10px #ffd20066}

/* Grid */
.grid-container{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(88vw,400px);padding:0 10px;margin-top:6px}

/* Card */
.card-wrapper{aspect-ratio:1;perspective:800px;cursor:pointer}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s ease;border-radius:12px}
.card.flipped{transform:rotateY(180deg)}
.card.matched{transform:rotateY(180deg)}
.card.matched .card-front{box-shadow:0 0 20px #f7971e44}

.card-back,.card-front{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center}

.card-back{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  border:1px solid #334155;
  z-index:2;
}
.card-back::before{
  content:'';position:absolute;inset:4px;border-radius:9px;
  background:repeating-linear-gradient(45deg,transparent,transparent 5px,#ffffff06 5px,#ffffff06 6px);
}
.card-back i{font-size:22px;color:#334155;z-index:1}

.card-front{
  transform:rotateY(180deg);
  background:linear-gradient(135deg,#1e293b,#0f172a);
  border:2px solid #f7971e55;
  flex-direction:column;
  gap:4px;
}
.card-front i{font-size:clamp(24px,7vw,36px)}

/* Icon colors */
.icon-0{color:#f472b6}.icon-1{color:#fbbf24}.icon-2{color:#f87171}
.icon-3{color:#a78bfa}.icon-4{color:#fb923c}.icon-5{color:#34d399}
.icon-6{color:#fcd34d}.icon-7{color:#94a3b8}

/* Overlays */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,8,22,.92);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.active{opacity:1;pointer-events:auto}
.overlay-content{text-align:center;padding:40px;max-width:380px;width:90%}
.overlay-content h2{font-size:32px;font-weight:900;margin-bottom:8px;background:linear-gradient(135deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.overlay-content p{color:#94a3b8;margin-bottom:20px;font-size:15px;line-height:1.6}
.overlay-content .final-score{font-size:28px;font-weight:900;color:#ffd200;margin:10px 0 4px}
.overlay-content .best-label{font-size:13px;color:#64748b;margin-bottom:20px}
.btn-play{background:linear-gradient(135deg,#f7971e,#ffd200);color:#050816;border:none;padding:14px 40px;border-radius:12px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:16px;cursor:pointer;transition:transform .15s,box-shadow .15s;display:inline-block;margin:6px}
.btn-play:hover{transform:scale(1.05);box-shadow:0 0 30px #f7971e55}
.btn-secondary{background:transparent;border:1px solid #334155;color:#94a3b8;padding:12px 30px;border-radius:12px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:all .2s;display:inline-block;margin:6px;text-decoration:none}
.btn-secondary:hover{border-color:#f7971e;color:#fff}
.win-stars{font-size:36px;margin:16px 0;display:flex;justify-content:center;gap:6px}
.win-stars i{color:#334155}
.win-stars i.active{color:#ffd200;text-shadow:0 0 15px #ffd20066}

/* Celebration particles */
.confetti{position:fixed;top:-10px;width:10px;height:10px;border-radius:2px;z-index:200;pointer-events:none;animation:fall linear forwards}
@keyframes fall{
  0%{opacity:1;transform:translateY(0) rotate(0deg)}
  100%{opacity:0;transform:translateY(100vh) rotate(720deg)}
}

/* New game btn in bar */
.new-game-btn{background:linear-gradient(135deg,#f7971e,#ffd200);color:#050816;border:none;padding:8px 16px;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:transform .15s}
.new-game-btn:hover{transform:scale(1.05)}

.instructions-icons{display:flex;justify-content:center;gap:12px;margin:12px 0 20px;font-size:28px}
.instructions-icons i{opacity:.6}
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html#juegos"><i class="fas fa-arrow-left"></i> Volver</a>
  <h1>Memory</h1>
  <button class="new-game-btn" id="btnNew"><i class="fas fa-redo"></i></button>
</div>

<div class="stats-row">
  <div class="stat-box"><div class="label">Movimientos</div><div class="value" id="movesDisplay">0</div></div>
  <div class="stat-box"><div class="label">Tiempo</div><div class="value" id="timeDisplay">0s</div></div>
  <div class="stat-box"><div class="label">Pares</div><div class="value" id="pairsDisplay">0/8</div></div>
</div>

<div class="stars" id="starsDisplay">
  <i class="fas fa-star active"></i>
  <i class="fas fa-star active"></i>
  <i class="fas fa-star active"></i>
</div>

<div class="grid-container" id="grid"></div>

<!-- Start Overlay -->
<div class="overlay active" id="startOverlay">
  <div class="overlay-content">
    <h2>Memory</h2>
    <p>Encuentra todos los pares de iconos. Menos movimientos = mas estrellas!</p>
    <div class="instructions-icons">
      <i class="fas fa-rocket icon-0"></i>
      <i class="fas fa-star icon-1"></i>
      <i class="fas fa-heart icon-2"></i>
      <i class="fas fa-bolt icon-3"></i>
      <i class="fas fa-fire icon-4"></i>
      <i class="fas fa-gem icon-5"></i>
      <i class="fas fa-crown icon-6"></i>
      <i class="fas fa-skull-crossbones icon-7"></i>
    </div>
    <button class="btn-play" id="btnStart"><i class="fas fa-play"></i> Jugar</button>
  </div>
</div>

<!-- Win Overlay -->
<div class="overlay" id="winOverlay">
  <div class="overlay-content">
    <h2>Felicidades!</h2>
    <div class="win-stars" id="winStars"></div>
    <div class="final-score" id="finalMoves">0 movimientos</div>
    <p id="finalTime" style="margin-bottom:4px"></p>
    <div class="best-label">Mejor: <span id="finalBest">-</span> movimientos</div>
    <button class="btn-play" id="btnReplay"><i class="fas fa-redo"></i> Jugar de nuevo</button>
    <br>
    <a href="../index.html#juegos" class="btn-secondary"><i class="fas fa-th"></i> Mas juegos</a>
  </div>
</div>

<script>
(function(){
  const ICONS = ['fa-rocket','fa-star','fa-heart','fa-bolt','fa-fire','fa-gem','fa-crown','fa-skull-crossbones'];
  const grid = document.getElementById('grid');
  let cards, flippedCards, matchedPairs, moves, timerInterval, seconds, locked;
  let bestMoves = parseInt(localStorage.getItem('bestMemory')||'999');

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function updateStars(){
    const el = document.getElementById('starsDisplay');
    const s = moves < 16 ? 3 : moves < 24 ? 2 : 1;
    el.innerHTML = '';
    for(let i=0;i<3;i++){
      const star = document.createElement('i');
      star.className = 'fas fa-star' + (i<s?' active':'');
      el.appendChild(star);
    }
  }

  function startTimer(){
    seconds = 0;
    document.getElementById('timeDisplay').textContent = '0s';
    timerInterval = setInterval(()=>{
      seconds++;
      const m = Math.floor(seconds/60);
      const s = seconds%60;
      document.getElementById('timeDisplay').textContent = m>0?`${m}m ${s}s`:`${s}s`;
    },1000);
  }

  function stopTimer(){ clearInterval(timerInterval); }

  function celebrate(){
    const colors = ['#f7971e','#ffd200','#f472b6','#a78bfa','#34d399','#fb923c','#fbbf24'];
    for(let i=0;i<40;i++){
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random()*100+'vw';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.animationDuration = (1.5+Math.random()*2)+'s';
      el.style.animationDelay = Math.random()*0.5+'s';
      el.style.width = (6+Math.random()*8)+'px';
      el.style.height = (6+Math.random()*8)+'px';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),4000);
    }
  }

  function showWin(){
    stopTimer();
    celebrate();
    const s = moves < 16 ? 3 : moves < 24 ? 2 : 1;

    if(moves < bestMoves){
      bestMoves = moves;
      localStorage.setItem('bestMemory', bestMoves);
    }

    document.getElementById('finalMoves').textContent = moves + ' movimientos';
    const m = Math.floor(seconds/60), sec = seconds%60;
    document.getElementById('finalTime').textContent = 'Tiempo: ' + (m>0?`${m}m ${sec}s`:`${sec}s`);
    document.getElementById('finalBest').textContent = bestMoves === 999 ? '-' : bestMoves;

    const ws = document.getElementById('winStars');
    ws.innerHTML = '';
    for(let i=0;i<3;i++){
      const star = document.createElement('i');
      star.className = 'fas fa-star'+(i<s?' active':'');
      ws.appendChild(star);
    }

    setTimeout(()=>{ document.getElementById('winOverlay').classList.add('active'); }, 600);
  }

  function handleCardClick(index){
    if(locked) return;
    const card = cards[index];
    if(card.flipped || card.matched) return;

    card.flipped = true;
    card.el.classList.add('flipped');
    flippedCards.push(index);

    if(flippedCards.length === 2){
      moves++;
      document.getElementById('movesDisplay').textContent = moves;
      updateStars();
      locked = true;

      const [a,b] = flippedCards;
      if(cards[a].icon === cards[b].icon){
        cards[a].matched = true;
        cards[b].matched = true;
        cards[a].el.classList.add('matched');
        cards[b].el.classList.add('matched');
        matchedPairs++;
        document.getElementById('pairsDisplay').textContent = matchedPairs+'/8';
        flippedCards = [];
        locked = false;
        if(matchedPairs === 8) showWin();
      } else {
        setTimeout(()=>{
          cards[a].flipped = false;
          cards[b].flipped = false;
          cards[a].el.classList.remove('flipped');
          cards[b].el.classList.remove('flipped');
          flippedCards = [];
          locked = false;
        }, 800);
      }
    }
  }

  function init(){
    grid.innerHTML = '';
    const pairs = [];
    ICONS.forEach((icon,i)=>{ pairs.push({icon,idx:i}); pairs.push({icon,idx:i}); });
    shuffle(pairs);

    cards = [];
    flippedCards = [];
    matchedPairs = 0;
    moves = 0;
    locked = false;
    document.getElementById('movesDisplay').textContent = '0';
    document.getElementById('pairsDisplay').textContent = '0/8';
    updateStars();
    stopTimer();
    startTimer();

    pairs.forEach((p,i)=>{
      const wrapper = document.createElement('div');
      wrapper.className = 'card-wrapper';

      const card = document.createElement('div');
      card.className = 'card';

      const back = document.createElement('div');
      back.className = 'card-back';
      back.innerHTML = '<i class="fas fa-question"></i>';

      const front = document.createElement('div');
      front.className = 'card-front';
      front.innerHTML = `<i class="fas ${p.icon} icon-${p.idx}"></i>`;

      card.appendChild(back);
      card.appendChild(front);
      wrapper.appendChild(card);
      grid.appendChild(wrapper);

      wrapper.addEventListener('click', ()=>handleCardClick(i));

      cards.push({ icon:p.icon, idx:p.idx, flipped:false, matched:false, el:card });
    });
  }

  // Buttons
  document.getElementById('btnStart').onclick = ()=>{ document.getElementById('startOverlay').classList.remove('active'); init(); };
  document.getElementById('btnReplay').onclick = ()=>{ document.getElementById('winOverlay').classList.remove('active'); init(); };
  document.getElementById('btnNew').onclick = ()=>{ document.getElementById('winOverlay').classList.remove('active'); document.getElementById('startOverlay').classList.remove('active'); init(); };
})();
</script>
</body>
</html>
